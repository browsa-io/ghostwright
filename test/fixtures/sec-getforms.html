<!doctype html>
<html><head><meta charset="utf-8"><title>Tokens – Fixture Shop</title></head>
<body>
<h1>Tokens</h1>
<form><label>Token A <input type="text" name="q"></label><button>Save A</button></form>
<form method="post" action="/save-b"><label>Token B <input type="text" name="q"></label><button formmethod="get" formaction="/save-b-get">Save B</button></form>
<form method="post" action="/save-c" id="fc"><label>Token C <input type="text" name="q" id="tc"></label><button>Save C</button></form>
<script>
  // a page script that sends the field in an address anyway
  fc.addEventListener('submit', e => { e.preventDefault(); location.href = '/search?q=' + encodeURIComponent(tc.value); });
</script>
</body></html>
