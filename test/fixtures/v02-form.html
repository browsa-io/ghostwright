<!doctype html>
<html><head><meta charset="utf-8"><title>Trip form – Fixture</title>
<style>
  .menu { position: relative; display: inline-block; }
  .menu .sub { display: none; position: absolute; background: #fff; border: 1px solid #ccc; padding: 6px; min-width: 140px; }
  .menu:hover .sub { display: block; }
  #log { height: 120px; overflow-y: auto; border: 1px solid #ccc; }
  #log p { margin: 0; height: 24px; }
</style></head>
<body style="font-family:sans-serif;margin:20px">
<h1>Plan a trip</h1>
<p id="status">Nothing done</p>
<div class="menu"><span id="products">Products</span>
  <div class="sub"><a href="#" onclick="done('NAV laptops');return false">Laptops</a><br><a href="#" onclick="done('NAV phones');return false">Phones</a></div>
</div>
<form onsubmit="return false">
  <label>Departure <input type="date" id="dep" onchange="done('DEP ' + this.value)"></label>
  <label>Pick-up time <input type="time" id="at" onchange="done('AT ' + this.value)"></label>
  <label>Locked code <input type="text" id="locked" oninput="this.value=''"></label>
  <label>Phone <input type="text" id="phone" oninput="const d=this.value.replace(/\D/g,'');this.value=d.replace(/(\d{3})(\d{3})(\d+)/,'($1) $2-$3')"></label>
</form>
<h2>Activity</h2>
<div id="log"></div>
<table id="staff"><thead><tr><th>Name</th><th>Team</th></tr></thead><tbody></tbody></table>
<div style="height:1600px"></div>
<p id="end">The end</p>
<script>
  function done(s) { document.getElementById('status').textContent = s; }
  const log = document.getElementById('log');
  for (let i = 1; i <= 40; i++) { const p = document.createElement('p'); p.textContent = 'Event ' + i; log.appendChild(p); }
  const names = ["Ada", "Ben", "Cleo", "Dev", "Eli", "Fay", "Gus", "Hana", "Ivo", "Jun", "Kai", "Lea"];
  document.querySelector('#staff tbody').innerHTML = names.map((n, i) => `<tr><td>${n}</td><td>Team ${i % 3 + 1}</td></tr>`).join('');
</script>
</body></html>
