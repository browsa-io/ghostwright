<!doctype html>
<html><head><meta charset="utf-8"><title>Compare – Fixture</title>
<style>.card{border:1px solid #ccc;padding:8px;margin:8px 0}</style></head>
<body style="font-family:sans-serif;margin:20px">
<h1>Compare laptops</h1>
<p id="status">Comparing: none</p>
<p id="left"></p>
<div id="grid"></div>
<script>
  // "changed": the same cards in another order (a new sort, a new default)
  let models = [["Model A", "13-inch, 8 GB", "999"], ["Model B", "14-inch, 16 GB", "1299"], ["Model C", "15-inch, 16 GB", "1499"], ["Model D", "16-inch, 32 GB", "1999"]];
  if ("__VARIANT__" === "changed") models = [models[3], models[1], models[0], models[2]];
  // a removed card stays removed for the browser session
  const gone = new Set(JSON.parse(sessionStorage.getItem("gone") || "[]"));
  models = models.filter(m => !gone.has(m[0]));
  const picked = new Set();
  const grid = document.getElementById("grid");
  const show = () => { document.getElementById("left").textContent = grid.children.length + " laptops"; };
  grid.innerHTML = models.map(m => `<div class="card"><h2>${m[0]}</h2><p>${m[1]}</p><p>${m[2]} credits</p><label><input type="checkbox" data-m="${m[0]}"> Compare</label> <button data-m="${m[0]}">Remove</button></div>`).join("");
  show();
  grid.addEventListener("change", e => {
    const m = e.target.dataset.m;
    if (e.target.checked) picked.add(m); else picked.delete(m);
    document.getElementById("status").textContent = "Comparing: " + ([...picked].sort().join(", ") || "none");
  });
  grid.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    gone.add(e.target.dataset.m);
    sessionStorage.setItem("gone", JSON.stringify([...gone]));
    e.target.closest(".card").remove();
    show();
  });
</script>
</body></html>
