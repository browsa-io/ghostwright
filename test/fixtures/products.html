<!doctype html>
<html><head><meta charset="utf-8"><title>Products – Fixture Shop</title>
<style>body{font-family:sans-serif;margin:40px} .card{border:1px solid #ccc;padding:8px;margin:6px 0;max-width:420px}</style>
</head><body>
<h1>Products</h1>
<label>Search <input type="search" id="q" placeholder="Search products"></label>
<button id="go">Search</button>
<ul id="list" class="products"></ul>
<script>
  // the list comes from a JSON API, like most shops
  async function load(q) {
    const r = await fetch('/api/products.json' + (q ? '?q=' + encodeURIComponent(q) : ''));
    const j = await r.json();
    const ul = document.getElementById('list');
    ul.innerHTML = '';
    for (const p of j.data.items) {
      const li = document.createElement('li');
      li.className = 'card product';
      li.innerHTML = '<a class="title" href="/p/' + p.slug + '"></a> <span class="price"></span> <span class="stock"></span>';
      li.querySelector('.title').textContent = p.name;
      li.querySelector('.price').textContent = '$' + p.price.toFixed(2);
      li.querySelector('.stock').textContent = p.inStock ? 'In stock' : 'Sold out';
      ul.appendChild(li);
    }
  }
  document.getElementById('go').addEventListener('click', () => load(document.getElementById('q').value));
  load('');
</script>
</body></html>
