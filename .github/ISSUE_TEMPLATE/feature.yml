name: Idea or request
description: Something Ghostwright should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and where Ghostwright gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: An API you would like to call, or what the result should look like.
  - type: textarea
    id: now
    attributes:
      label: What do you do instead today?
