name: Bug report
description: Something Ghostwright did wrong, or did not do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A small page or flow that shows the problem gets it fixed fastest.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Ghostwright version
      description: "`npx ghostwright --version`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version, OS, and the browser (local Chrome, a CDP endpoint, Browsa)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model (if a model was involved)
      placeholder: openai/gpt-5.6-luna
  - type: textarea
    id: what
    attributes:
      label: What you did
      description: The code, and the page or a cut-down copy of it. Remove keys, cookies and personal data.
      render: ts
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What happened, and what you expected
      description: "The result (`ok`, `reason`, `action`), the error with its `code`, and the trace line from `.ghostwright/traces/` if there is one."
    validations:
      required: true
