name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: unit, types, package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows has not had a green run yet: it reports, and does not fail the build, until it has.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx vitest run test/unit
      - run: npm run docs:check
      # the package as npm serves it: ESM import, CommonJS require, types in both, the CLI, the quickstart
      - run: npm run pack:check

  e2e:
    name: e2e on the fixture site (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux runners restrict Chrome's sandbox; until that run is green it reports without failing the build.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Let Chrome use its sandbox (Linux runners)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run build
      # local Chrome (preinstalled on the runner), the fixture site in test/fixtures, a mock model: no key, no cost
      - run: npx vitest run test/e2e

  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Names check
        env:
          NAMES_PATTERN: ${{ secrets.NAMES_PATTERN }}
        run: |
          # The list of names this project never mentions is kept outside the repository.
          # Without it (a pull request from a fork) the check is skipped.
          if [ -z "$NAMES_PATTERN" ]; then echo "names list not available here; skipped"; exit 0; fi
          if grep -rniE "$NAMES_PATTERN" --exclude-dir=node_modules --exclude-dir=.git . > /dev/null; then
            echo "Ghostwright names no other SDK or company." && exit 1
          fi
